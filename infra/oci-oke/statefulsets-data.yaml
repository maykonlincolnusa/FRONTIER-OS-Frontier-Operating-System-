apiVersion: v1
kind: Secret
metadata:
  name: frontier-secrets
  namespace: frontier-c4isr
type: Opaque
stringData:
  POSTGRES_USER: frontier
  POSTGRES_PASSWORD: frontier_c4isr_secret
  POSTGRES_DB: frontier_c4isr
  REDIS_PASSWORD: ""
  QDRANT_API_KEY: ""
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontier-config
  namespace: frontier-c4isr
data:
  POSTGRES_HOST: "postgis.frontier-c4isr.svc.cluster.local"
  POSTGRES_PORT: "5432"
  REDIS_HOST: "redis.frontier-c4isr.svc.cluster.local"
  REDIS_PORT: "6379"
  QDRANT_HOST: "qdrant.frontier-c4isr.svc.cluster.local"
  QDRANT_PORT: "6333"
  ENVIRONMENT: "production"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
---
# ==============================================================================
# 1. PostgreSQL / PostGIS (16-3.4) on OCI Block Volume
# ==============================================================================
apiVersion: v1
kind: Service
metadata:
  name: postgis
  namespace: frontier-c4isr
  labels:
    app: postgis
spec:
  ports:
    - port: 5432
      name: postgresql
  clusterIP: None
  selector:
    app: postgis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgis
  namespace: frontier-c4isr
spec:
  serviceName: postgis
  replicas: 1
  selector:
    matchLabels:
      app: postgis
  template:
    metadata:
      labels:
        app: postgis
    spec:
      containers:
        - name: postgis
          image: postgis/postgis:16-3.4
          envFrom:
            - secretRef:
                name: frontier-secrets
          ports:
            - containerPort: 5432
              name: postgresql
          resources:
            requests:
              cpu: "300m"
              memory: "1536Mi"
            limits:
              cpu: "1000m"
              memory: "3072Mi"
          volumeMounts:
            - name: postgis-data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - frontier
                - -d
                - frontier_c4isr
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - frontier
                - -d
                - frontier_c4isr
            initialDelaySeconds: 10
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: postgis-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        storageClassName: oci-bv
        resources:
          requests:
            storage: 50Gi
---
# ==============================================================================
# 2. Qdrant Vector Database on OCI Block Volume
# ==============================================================================
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: frontier-c4isr
  labels:
    app: qdrant
spec:
  ports:
    - port: 6333
      name: http
    - port: 6334
      name: grpc
  clusterIP: None
  selector:
    app: qdrant
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qdrant
  namespace: frontier-c4isr
spec:
  serviceName: qdrant
  replicas: 1
  selector:
    matchLabels:
      app: qdrant
  template:
    metadata:
      labels:
        app: qdrant
    spec:
      containers:
        - name: qdrant
          image: qdrant/qdrant:v1.9.0
          ports:
            - containerPort: 6333
              name: http
            - containerPort: 6334
              name: grpc
          env:
            - name: QDRANT__SERVICE__GRPC_PORT
              value: "6334"
          resources:
            requests:
              cpu: "200m"
              memory: "1024Mi"
            limits:
              cpu: "800m"
              memory: "2048Mi"
          volumeMounts:
            - name: qdrant-data
              mountPath: /qdrant/storage
          livenessProbe:
            httpGet:
              path: /readyz
              port: 6333
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 6333
            initialDelaySeconds: 5
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: qdrant-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        storageClassName: oci-bv
        resources:
          requests:
            storage: 20Gi
---
# ==============================================================================
# 3. Redis (Cache & Distributed Locks) on OCI Block Volume
# ==============================================================================
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: frontier-c4isr
  labels:
    app: redis
spec:
  ports:
    - port: 6379
      name: redis
  clusterIP: None
  selector:
    app: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: frontier-c4isr
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command: ["redis-server", "--appendonly", "yes"]
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "300m"
              memory: "768Mi"
          volumeMounts:
            - name: redis-data
              mountPath: /data
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        storageClassName: oci-bv
        resources:
          requests:
            storage: 10Gi

