# ==============================================================================
# Project Frontier (FRONTIER-C4ISR) - OCI Ampere A1 Optimized Docker Compose
# Specially tuned for Oracle Cloud Always Free VM.Standard.A1.Flex
# Specs: 4 OCPU (4 Arm64 Neoverse-N1 Cores), 24 GB RAM, 200 GB NVMe Storage
# ==============================================================================

version: '3.8'

services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: frontier-postgis
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-frontier}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-frontier_c4isr_secret}
      POSTGRES_DB: ${POSTGRES_DB:-frontier_c4isr}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./infra/postgres/init-postgis.sql:/docker-entrypoint-initdb.d/init-postgis.sql:ro
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 3072M
        reservations:
          cpus: '0.25'
          memory: 1024M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-frontier} -d ${POSTGRES_DB:-frontier_c4isr}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - frontier-network

  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: frontier-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    deploy:
      resources:
        limits:
          cpus: '0.8'
          memory: 2048M
        reservations:
          cpus: '0.2'
          memory: 512M
    networks:
      - frontier-network

  redis:
    image: redis:7-alpine
    container_name: frontier-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: '0.4'
          memory: 1024M
    networks:
      - frontier-network

  # Local Redpanda Kafka (Optional: can be pointed to OCI Streaming via KAFKA_BOOTSTRAP_SERVERS)
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.2
    container_name: frontier-redpanda
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - "1G"
      - --reserve-memory
      - "0M"
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports:
      - "9092:9092"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2048M
    networks:
      - frontier-network

  # C2 Gateway (FastAPI + WebSockets + Deep Learning Multiprocessing)
  c2-gateway:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: frontier-c2-gateway
    restart: unless-stopped
    shm_size: '2gb' # IPC Shared memory for PyTorch ProcessPoolExecutor
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: production
      POSTGRES_HOST: postgis
      POSTGRES_PORT: 5432
      POSTGRES_USER: frontier
      POSTGRES_PASSWORD: frontier_c4isr_secret
      POSTGRES_DB: frontier_c4isr
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-redpanda:29092}
      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
      KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-PLAIN}
      KAFKA_SASL_USERNAME: ${KAFKA_SASL_USERNAME:-}
      KAFKA_SASL_PASSWORD: ${KAFKA_SASL_PASSWORD:-}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      # Ampere A1 CPU thread governance
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 3072M
    depends_on:
      - postgis
      - qdrant
      - redis
    networks:
      - frontier-network

  # C4ISR Next.js Tactical Dashboard
  dashboard:
    build:
      context: ../../dashboard-c2
      dockerfile: Dockerfile
    container_name: frontier-dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_C2_WS_URL: "ws://localhost:8000/ws/c2-stream"
    deploy:
      resources:
        limits:
          cpus: '0.8'
          memory: 1536M
    depends_on:
      - c2-gateway
    networks:
      - frontier-network

volumes:
  postgis_data:
    name: frontier_oci_postgis
  qdrant_data:
    name: frontier_oci_qdrant
  redis_data:
    name: frontier_oci_redis
  redpanda_data:
    name: frontier_oci_redpanda

networks:
  frontier-network:
    name: frontier-c4isr-net
    driver: bridge

