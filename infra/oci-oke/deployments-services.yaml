# ==============================================================================
# Project Frontier (FRONTIER-C4ISR) - OKE Microservices Deployments
# Multi-Arch aarch64/amd64 pods calibrated for OCI Ampere A1 (4 OCPU / 24GB RAM)
# Configured with /dev/shm IPC shared memory for PyTorch & InferenceProcessPool
# ==============================================================================

# --- C2 GATEWAY SERVICE & DEPLOYMENT ---
apiVersion: v1
kind: Service
metadata:
  name: c2-gateway
  namespace: frontier-c4isr
  labels:
    app: c2-gateway
spec:
  ports:
    - port: 8000
      targetPort: 8000
      name: http-ws
  selector:
    app: c2-gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: c2-gateway
  namespace: frontier-c4isr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: c2-gateway
  template:
    metadata:
      labels:
        app: c2-gateway
    spec:
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
      containers:
        - name: c2-gateway
          image: frontier-c4isr/gateway:latest
          command: ["python", "-m", "uvicorn", "services.c2_gateway.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: frontier-config
            - secretRef:
                name: frontier-secrets
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
          resources:
            requests:
              cpu: "300m"
              memory: "1536Mi"
            limits:
              cpu: "800m"
              memory: "2560Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
