# --- DASHBOARD FRONTEND (NEXT.JS) ---
apiVersion: v1
kind: Service
metadata:
  name: dashboard-c2
  namespace: frontier-c4isr
  labels:
    app: dashboard-c2
spec:
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  selector:
    app: dashboard-c2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard-c2
  namespace: frontier-c4isr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard-c2
  template:
    metadata:
      labels:
        app: dashboard-c2
    spec:
      containers:
        - name: dashboard
          image: frontier-c4isr/dashboard:latest
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_C2_WS_URL
              value: "/ws/c2-stream"
          resources:
            requests:
              cpu: "100m"
              memory: "384Mi"
            limits:
              cpu: "500m"
              memory: "1024Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
