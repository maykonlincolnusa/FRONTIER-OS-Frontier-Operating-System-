# ==============================================================================
# Project Frontier (FRONTIER-OS) - Google Kubernetes Engine (GKE Autopilot)
# High-Reliability C4ISR Multi-Agent & Microservices Mesh
# Integrated with Cloud SQL (pgvector), Qdrant Vector DB & KEDA Event-Driven Scale
# ==============================================================================

# --- C2 GATEWAY SERVICE & DEPLOYMENT ---
apiVersion: v1
kind: Service
metadata:
  name: c2-gateway
  namespace: frontier-c4isr
  labels:
    app: c2-gateway
spec:
  ports:
    - port: 8000
      targetPort: 8000
      name: http-ws
  selector:
    app: c2-gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: c2-gateway
  namespace: frontier-c4isr
spec:
  replicas: 2
  selector:
    matchLabels:
      app: c2-gateway
  template:
    metadata:
      labels:
        app: c2-gateway
    spec:
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
      containers:
        - name: gateway
          image: us-central1-docker.pkg.dev/${PROJECT_ID}/frontier-c4isr/gateway:latest
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          volumeMounts:
            - mountPath: /dev/shm
              name: dshm
          env:
            - name: GCP_PROJECT_ID
              value: "${PROJECT_ID}"
            - name: GCP_REGION
              value: "us-central1"
            - name: GCS_WEIGHTS_BUCKET
              value: "frontier-c4isr-weights"
            - name: POSTGRES_HOST
              value: "127.0.0.1"
            - name: POSTGRES_PORT
              value: "5432"
            - name: REDIS_HOST
              value: "redis-service"
            - name: QDRANT_HOST
              value: "qdrant-service"
          ports:
            - containerPort: 8000
              name: http
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
---
# --- C4ISR TACTICAL DASHBOARD (NEXT.JS) ---
apiVersion: v1
kind: Service
metadata:
  name: tactical-dashboard
  namespace: frontier-c4isr
  labels:
    app: tactical-dashboard
spec:
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  selector:
    app: tactical-dashboard
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tactical-dashboard
  namespace: frontier-c4isr
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tactical-dashboard
  template:
    metadata:
      labels:
        app: tactical-dashboard
    spec:
      containers:
        - name: dashboard
          image: us-central1-docker.pkg.dev/${PROJECT_ID}/frontier-c4isr/dashboard:latest
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "2Gi"
          env:
            - name: NEXT_PUBLIC_GATEWAY_URL
              value: "http://c2-gateway:8000"
            - name: NEXT_PUBLIC_WS_URL
              value: "ws://c2-gateway:8000/ws/c2-stream"
          ports:
            - containerPort: 3000
              name: http
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 20
---
# --- QDRANT VECTOR DATABASE (FBI & FACIAL EMBEDDINGS) ---
apiVersion: v1
kind: Service
metadata:
  name: qdrant-service
  namespace: frontier-c4isr
spec:
  ports:
    - port: 6333
      name: http
    - port: 6334
      name: grpc
  selector:
    app: qdrant
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qdrant
  namespace: frontier-c4isr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qdrant
  template:
    metadata:
      labels:
        app: qdrant
    spec:
      containers:
        - name: qdrant
          image: qdrant/qdrant:v1.13.4
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          ports:
            - containerPort: 6333
              name: http
            - containerPort: 6334
              name: grpc
