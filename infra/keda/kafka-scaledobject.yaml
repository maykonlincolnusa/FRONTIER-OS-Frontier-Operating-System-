apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: redpanda-auth
  namespace: frontier-os
spec:
  secretTargetRef:
    - parameter: sasl
      name: redpanda-credentials
      key: sasl-mechanism
---
# 01. Maritime & Blue Border Subsystem Autoscaler
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: maritime-coastline-scaler
  namespace: frontier-os
  labels:
    app.kubernetes.io/name: frontier-os
    app.kubernetes.io/subsystem: 01-maritime-coastline
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontier-maritime-coastline
  minReplicaCount: 1
  maxReplicaCount: 10
  pollingInterval: 5
  cooldownPeriod: 30
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - type: Percent
              value: 100
              periodSeconds: 15
        scaleDown:
          stabilizationWindowSeconds: 60
          policies:
            - type: Percent
              value: 25
              periodSeconds: 30
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: redpanda.frontier-os.svc.cluster.local:9092
        consumerGroup: frontier-maritime-consumer-group
        topic: raw.ais.positions
        lagThreshold: "30"
        offsetResetPolicy: latest
    - type: kafka
      metadata:
        bootstrapServers: redpanda.frontier-os.svc.cluster.local:9092
        consumerGroup: frontier-maritime-alert-group
        topic: alerts.maritime.threats
        lagThreshold: "10"
        offsetResetPolicy: latest
---
