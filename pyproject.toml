[project]
name = "frontier-c4isr"
version = "0.1.0"
description = "Project Frontier (FRONTIER-C4ISR) - Unified System of Systems Architecture for US Border Security"
readme = "ARCHITECTURE.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "sqlalchemy>=2.0.28",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "geoalchemy2>=0.14.4",
    "aiokafka>=0.10.0",
    "qdrant-client>=1.8.2",
    "redis>=5.0.3",
    "httpx>=0.27.0",
    "shapely>=2.0.3",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "torch>=2.15.0",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
